# imports-to-subpath: every relative or alias import of a file that --targets matches becomes a --prefix
# import (a package.json "imports" key such as "#/*" that maps to one folder). --files says which files change.
# Subpath imports need the file's extension, so extensionless and folder imports stay.
# The case shape (input, options, output, throws) is described at actionToml in @jig/test-utils:
# a string input is src/a.ts, options are the flags in order, output is the files that changed.

name = "imports-to-subpath"


[[suites]]
name = "imports-to-subpath"


[[suites.tests]]
name = "relative and alias imports become subpath imports; subpath ones stay"
input = {}
options = {
	files = "src/**",
	targets = "**",
	prefix = "#/",
}
output = {
	"src/components/Invoice.ts" = '''
import { formatDay } from "#/lib/date.ts";
import type { Day } from "#/lib/date.ts";
import { cents } from "#/lib/money.ts";

export function invoiceLine(day: Day, amount: number): string {
  return `${formatDay(day)}: ${cents(amount)}`;
}

export const loadLib = () => import("#/lib/index.ts");
''',
	"src/lib/index.ts" = '''
export { formatDay } from "#/lib/date.ts";
export { cents } from "#/lib/money.ts";
''',
	"src/main.ts" = '''
import { invoiceLine } from "#/components/Invoice.ts";
import { formatDay } from "#/lib/index.ts";

console.log(invoiceLine({ year: 2026, month: 1, day: 2 }, 1250));
console.log(formatDay({ year: 2026, month: 1, day: 3 }));
''',
}


[[suites.tests]]
name = "the .ts form is kept; extensionless and folder imports cannot be subpath imports and are left"
input = {
	"src/extra/forms.ts" = '''
import { formatDay } from "../lib/date";
import { cents } from "../lib";
import type { Day } from "../lib/date.ts";
export const x = [formatDay, cents] as const;
export type D = Day;
''',
}
options = {
	files = "src/extra/**",
	targets = "**",
	prefix = "#/",
}
output = {
	"src/extra/forms.ts" = '''
import { formatDay } from "../lib/date";
import { cents } from "../lib";
import type { Day } from "#/lib/date.ts";
export const x = [formatDay, cents] as const;
export type D = Day;
''',
}


[[suites.tests]]
name = "import types, re-exports, import(), import = require(), require() and import() types all change"
input = {
	"src/extra/forms.ts" = '''
declare function require(id: string): unknown;
import type { Day } from "@/lib/date.ts";
import { type Day as D2, formatDay } from "@/lib/date.ts";
export { cents } from "@/lib/money.ts";
export * from "@/lib/index.ts";
import money = require("@/lib/money.ts");
const late = require("@/lib/date.ts");
export const lazy = () => import("@/lib/money.ts");
export type DateModule = typeof import("@/lib/date.ts");
export const all = [formatDay, money, late];
export type Both = [Day, D2];
''',
}
options = {
	files = "src/extra/**",
	targets = "**",
	prefix = "#/",
}
output = {
	"src/extra/forms.ts" = '''
declare function require(id: string): unknown;
import type { Day } from "#/lib/date.ts";
import { type Day as D2, formatDay } from "#/lib/date.ts";
export { cents } from "#/lib/money.ts";
export * from "#/lib/index.ts";
import money = require("#/lib/money.ts");
const late = require("#/lib/date.ts");
export const lazy = () => import("#/lib/money.ts");
export type DateModule = typeof import("#/lib/date.ts");
export const all = [formatDay, money, late];
export type Both = [Day, D2];
''',
}


[[suites.tests]]
name = "packages and subpath imports (also through another key) are untouched"
input = {
	"package.json" = '''
{ "type": "module", "imports": { "#/*": "./src/*", "#money": "./src/lib/money.ts" } }
''',
	"src/extra/pkg.ts" = '''
import { thing } from "some-package";
import { cents } from "#money";
import { formatDay } from "#/lib/date.ts";
export const x = [thing, cents, formatDay];
''',
}
options = {
	files = "src/extra/**",
	targets = "**",
	prefix = "#/",
}
throws = "^NO_CHANGES: "


[[suites.tests]]
name = "a prefix missing from the nearest package.json imports is refused"
input = {
	"package.json" = '''
{ "name": "x", "type": "module" }
''',
}
options = {
	files = "src/**",
	targets = "**",
	prefix = "#/",
}
throws = "^INVALID_ARGS: "


[[suites.tests]]
name = "a prefix mapped to something other than one folder is refused"
input = {
	"package.json" = '''
{ "type": "module", "imports": { "#/*": { "types": "./src/*", "default": "./dist/*" } } }
''',
}
options = {
	files = "src/**",
	targets = "**",
	prefix = "#/",
}
throws = "^REFACTOR_UNAVAILABLE: "


[[suites.tests]]
name = "--prefix must start with #"
input = {}
options = {
	files = "src/**",
	targets = "**",
	prefix = "@/",
}
throws = "^INVALID_ARGS: "


[[suites.tests]]
name = "--prefix must end in a slash"
input = {}
options = {
	files = "src/**",
	targets = "**",
	prefix = "#",
}
throws = "^INVALID_ARGS: "


[[suites.tests]]
name = "--prefix is required"
input = {}
options = {
	files = "src/**",
	targets = "**",
}
throws = "^INVALID_ARGS: "


[[suites]]
name = "edge cases"


[[suites.tests]]
name = "uses the nearest package.json's imports, not the root's"
input = {
	"packages/inner/package.json" = '''
{ "name": "inner", "type": "module", "imports": { "#/*": "./src/*" } }
''',
	"packages/inner/src/util.ts" = '''
export const u = 1;
''',
	"packages/inner/src/deep/use.ts" = '''
import { u } from "../util.ts";
export const z = u;
''',
}
options = {
	files = "packages/inner/**",
	targets = "**",
	prefix = "#/",
}
output = {
	"packages/inner/src/deep/use.ts" = '''
import { u } from "#/util.ts";
export const z = u;
''',
}
