[[suites.tests]]
name = "accepts the initializer function () {}"
input = '''
export function f() {
  const a = function () {};
  return f;
}
'''
options = {
	at = 'src/a.ts:2',
}
output = '''
export function f() {
  return f;
}
'''


[[suites.tests]]
name = "accepts the initializer f as unknown"
input = '''
export function f() {
  const a = f as unknown;
  return f;
}
'''
options = {
	at = 'src/a.ts:2',
}
output = '''
export function f() {
  return f;
}
'''


[[suites.tests]]
name = "refuses a destructured element before a rest element (the rest would pick the property up)"
input = '''
export function f(o: { a: number; b: number }) {
  const { a, ...rest } = o;
  return rest;
}
'''
options = {
	at = 'src/a.ts:2:11',
}
throws = "^REFACTOR_UNAVAILABLE: `a` \\(src/a\\.ts:2:11\\) sits before a `\\.\\.\\.rest` element"


[[suites.tests]]
name = "refuses the only element of a nested pattern"
input = '''
export function f(o: { a: { b: number }; c: number }) {
  const { a: { b }, c } = o;
  return c;
}
'''
options = {
	at = 'src/a.ts:2:16',
}
throws = "^REFACTOR_UNAVAILABLE: `b` is the only element of a nested pattern"


[[suites.tests]]
name = "refuses an array pattern over a call"
input = '''
export function f(p: number[]) {
  const [a] = p;
}
'''
options = {
	at = 'src/a.ts:2:10',
}
throws = "^REFACTOR_UNAVAILABLE: Removing `a` \\(src/a\\.ts:2:10\\) would drop the destructuring of an iterable"


[[suites.tests]]
name = "refuses the tail element of an array pattern over a generator"
input = '''
function* g() {
  yield 1;
  yield 2;
}
export function f() {
  const [a, b] = g();
  return a;
}
'''
options = {
	at = 'src/a.ts:6:13',
}
throws = "^REFACTOR_UNAVAILABLE: Removing `b` \\(src/a\\.ts:6:13\\) would drop the destructuring of an iterable"


[[suites.tests]]
name = "refuses the body of an if, which would be left without one"
input = '''
export function f(c: boolean) {
  if (c) var a = 1;
}
'''
options = {
	at = 'src/a.ts:2:14',
}
throws = "^REFACTOR_UNAVAILABLE: `a` is the only statement of a larger statement"


[[suites.tests]]
name = "a point that is not a variable name is refused"
input = '''
export function f() {
  const a = 1;
  return f;
}
'''
options = {
	at = 'src/a.ts:3:3',
}
throws = "^REFACTOR_UNAVAILABLE: There is no variable name at src/a\\.ts:3:3"


[[suites.tests]]
name = "a malformed --at (no line)"
input = {}
options = {
	at = 'src/report.ts',
}
throws = "^INVALID_ARGS: --at must be <path>:<line>"


[[suites.tests]]
name = "a missing --at"
input = {}
options = {}
throws = "^INVALID_ARGS: Missing --at"


[[suites.tests]]
name = "same-named locals in sibling blocks: the one at --at goes (first block)"
input = '''
export function f(a: boolean) {
  if (a) {
    const t = 1;
  } else {
    const t = 2;
  }
  return a;
}
'''
options = {
	at = 'src/a.ts:3',
}
output = '''
export function f(a: boolean) {
  if (a) {
  } else {
    const t = 2;
  }
  return a;
}
'''


[[suites.tests]]
name = "same-named locals in sibling blocks: the one at --at goes (second block)"
input = '''
export function f(a: boolean) {
  if (a) {
    const t = 1;
  } else {
    const t = 2;
  }
  return a;
}
'''
options = {
	at = 'src/a.ts:5',
}
output = '''
export function f(a: boolean) {
  if (a) {
    const t = 1;
  } else {
  }
  return a;
}
'''
