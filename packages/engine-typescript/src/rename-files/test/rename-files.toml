# rename-files: renames the files matching --files to the --case (kebab, camel, pascal or snake) and
# rewrites every import of them. Index files keep their name; a file whose new name is taken, or that two files
# would share, is left as it is. Declaration files are renamed with the file they declare.
#
# The case shape (input, options, output, throws) is described at actionToml in @jig/test-utils:
# a table input is files by path, options are the flags in order, output is every changed file, a deleted
# one is false.
#
# The example holds Helpers.ts next to helpers.ts on purpose, and TypeScript complains about that pair; the
# typecheck leaves that complaint out.
# A second run finding nothing to rename (NO_CHANGES) needs two runs: rename-files.test.ts.

name = "rename-files"


[[suites]]
name = "the examples/rename-files folder"


[[suites.tests]]
name = "kebab splits acronyms and keeps digits with the word before them"
input = {
	"src/HTTPServer.ts" = '''
export const server = 1;
''',
	"src/v2Api.ts" = '''
import { server } from "./HTTPServer";

export const api = server;
''',
}
options = {
	files = "src/HTTPServer.ts,src/v2Api.ts",
	case = "kebab",
}
output = {
	"src/HTTPServer.ts" = false,
	"src/http-server.ts" = '''
export const server = 1;
''',
	"src/v2-api.ts" = '''
import { server } from "./http-server";

export const api = server;
''',
	"src/v2Api.ts" = false,
}


[[suites.tests]]
name = "kebab: renames, rewrites importers, leaves names that are taken or clash alone"
input = {}
options = {
	files = "src/**",
	case = "kebab",
	typecheck = true,
}
output = {
	"src/Footer.ts" = false,
	"src/UserCard.ts" = false,
	"src/footer.ts" = '''
export const footer = "bye";
''',
	"src/index.ts" = '''
export * from "./user-card";
export * from "./order-item";
''',
	"src/main.ts" = '''
import { footer } from "./footer";
import { lower } from "./helpers";
import { endOfDay } from "./date-utils";
import { startOfDay } from "./date_utils";
import { orderTotal } from "./order-service";
import { userCard } from "./user-card";
import { ButtonGroup } from "./ui/button-group";

export const page = [footer, lower("X"), endOfDay, startOfDay, orderTotal(1), userCard("a"), ButtonGroup];
''',
	"src/order-item.ts" = '''
export const orderItem = { sku: "a-1", quantity: 2 };
''',
	"src/order-service.test.ts" = '''
import { orderTotal } from "./order-service";

export const checked = orderTotal(3) === 6;
''',
	"src/order-service.ts" = '''
import { orderItem } from "./order-item";

export function orderTotal(price: number): number {
  return price * orderItem.quantity;
}
''',
	"src/orderService.test.ts" = false,
	"src/orderService.ts" = false,
	"src/order_item.ts" = false,
	"src/ui/ButtonGroup.ts" = false,
	"src/ui/button-group.ts" = '''
import { userCard } from "../user-card";

export const ButtonGroup = userCard("buttons");
''',
	"src/user-card.ts" = '''
export function userCard(name: string): string {
  return `<card>${name}</card>`;
}
''',
}


