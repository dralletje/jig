[[suites]]
name = "declaration files"


[[suites.tests]]
name = "the file a declaration file declares is renamed with it, once"
input = {
	"src/widgets/myWidget.js" = '''
export const w = 1;
''',
	"src/widgets/myWidget.d.ts" = '''
export declare const w: number;
''',
	"src/widgets/use.ts" = '''
import { w } from "./myWidget.js";

export const x = w;
''',
	"src/widgets/themeColors.css" = '''
.a { color: red; }
''',
	"src/widgets/themeColors.d.css.ts" = '''
declare const styles: { a: string };
export default styles;
''',
}
options = {
	files = "src/widgets/**",
	case = "kebab",
}
output = {
	"src/widgets/my-widget.d.ts" = '''
export declare const w: number;
''',
	"src/widgets/my-widget.js" = '''
export const w = 1;
''',
	"src/widgets/myWidget.d.ts" = false,
	"src/widgets/myWidget.js" = false,
	"src/widgets/theme-colors.css" = '''
.a { color: red; }
''',
	"src/widgets/theme-colors.d.css.ts" = '''
declare const styles: { a: string };
export default styles;
''',
	"src/widgets/themeColors.css" = false,
	"src/widgets/themeColors.d.css.ts" = false,
	"src/widgets/use.ts" = '''
import { w } from "./my-widget.js";

export const x = w;
''',
}


[[suites.tests]]
name = "refuses when the new name of the declared file is taken"
input = {
	"src/widgets/myWidget.js" = '''
export const w = 1;
''',
	"src/widgets/myWidget.d.ts" = '''
export declare const w: number;
''',
	"src/widgets/use.ts" = '''
import { w } from "./myWidget.js";

export const x = w;
''',
	"src/widgets/themeColors.css" = '''
.a { color: red; }
''',
	"src/widgets/themeColors.d.css.ts" = '''
declare const styles: { a: string };
export default styles;
''',
	"src/widgets/my-widget.js" = '''
export const other = 2;
''',
}
options = {
	files = "src/widgets/**",
	case = "kebab",
}
throws = "^INVALID_ARGS: src/widgets/my-widget\\.js already exists, and src/widgets/myWidget\\.js, the file src/widgets/myWidget\\.d\\.ts declares"


