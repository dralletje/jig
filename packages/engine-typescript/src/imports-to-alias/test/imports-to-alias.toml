[[suites]]
name = "edge cases"


[[suites.tests]]
name = "a folder whose package.json points TypeScript at a declaration file elsewhere is left alone"
input = {
	"src/vendor/thing/package.json" = '''
{ "types": "dist/index.d.ts", "main": "lib/index.js" }
''',
	"src/vendor/thing/dist/index.d.ts" = '''
export declare const t: number;
''',
	"src/vendor/thing/lib/index.js" = '''
exports.t = 1;
''',
	"src/x/a.ts" = '''
import { t } from "../vendor/thing";
export const z = t;
''',
}
options = {
	files = "src/x/**",
	targets = "**",
	alias = "@/",
}
throws = "^NO_CHANGES: "


[[suites.tests]]
name = "a template-literal import(), .js for .ts, .mjs for .mts and an extensionless .tsx keep their form and quotes"
input = {
	"tsconfig.json" = '''
{
  "compilerOptions": {
    "module": "esnext",
    "moduleResolution": "bundler",
    "strict": true,
    "noEmit": true,
    "allowImportingTsExtensions": true,
    "types": [],
    "jsx": "react-jsx",
    "paths": {
      "@/*": [
        "./src/*"
      ]
    }
  }
}
''',
	"src/lib/m.mts" = '''
export const m = 1;
''',
	"src/lib/c.tsx" = '''
export const c = 1;
''',
	"src/x/a.ts" = '''
const l = import(`../lib/date.js`);
import { m } from "../lib/m.mjs";
import { c } from '../lib/c';
export const z = [l, m, c];
''',
}
options = {
	files = "src/x/**",
	targets = "**",
	alias = "@/",
}
output = {
	"src/x/a.ts" = '''
const l = import(`@/lib/date.js`);
import { m } from "@/lib/m.mjs";
import { c } from '@/lib/c';
export const z = [l, m, c];
''',
}
