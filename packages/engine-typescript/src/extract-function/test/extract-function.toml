[[suites.tests]]
name = "a property declared in another file, at offsets that fall inside the lines, is not a declaration of theirs"
input = '''
import type { State } from "./state.ts";

export function f(state: State) {
  if (!state.started) return 0;
  const outcome = state.outcome;
  const doubled = outcome * 2;
  console.log(doubled);
  return state.started ? 1 : 2;
}
'''
options = {
	file = "src/a.ts",
	lines = "6",
	name = "double",
	params = "outcome",
	returns = "doubled",
	extra_files = {
		"src/state.ts" = '''
// xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
export type State = { readonly started: false } | { readonly started: true; outcome: number };
''',
	},
}
output = '''
import type { State } from "./state.ts";

function double(outcome: number) {
  return outcome * 2;
}

export function f(state: State) {
  if (!state.started) return 0;
  const outcome = state.outcome;
  const doubled = double(outcome);
  console.log(doubled);
  return state.started ? 1 : 2;
}
'''


