[[suites]]
name = "returns"


[[suites.tests]]
name = "one value, a let stays a let"
input = '''
type Item = { price: number };

export function total(items: Item[]) {
  let sum = 0;
  for (const item of items) sum += item.price;
  sum = sum * 1.21;
  return sum;
}
'''
options = {
	file = "src/a.ts",
	lines = "4-5",
	name = "sumPrices",
	params = "items",
	returns = "sum",
}
output = '''
type Item = { price: number };

function sumPrices(items: Item[]) {
  let sum = 0;
  for (const item of items) sum += item.price;
  return sum;
}

export function total(items: Item[]) {
  let sum = sumPrices(items);
  sum = sum * 1.21;
  return sum;
}
'''


[[suites.tests]]
name = "one object"
input = '''
export function stats(values: number[]) {
  const min = Math.min(...values);
  const max = Math.max(...values);
  return `${min}-${max}`;
}
'''
options = {
	file = "src/a.ts",
	lines = "2-3",
	name = "range",
	params = "values",
	returns = "{ min, max }",
}
output = '''
function range(values: number[]) {
  const min = Math.min(...values);
  const max = Math.max(...values);
  return { min, max };
}

export function stats(values: number[]) {
  const { min, max } = range(values);
  return `${min}-${max}`;
}
'''


[[suites.tests]]
name = "one tuple, typed so it destructures"
input = '''
export function stats(values: number[]) {
  const min = Math.min(...values);
  const label = `of ${values.length}`;
  return `${min} ${label}`;
}
'''
options = {
	file = "src/a.ts",
	lines = "2-3",
	name = "summary",
	params = "values",
	returns = "[min, label]",
}
output = '''
function summary(values: number[]): [number, string] {
  const min = Math.min(...values);
  const label = `of ${values.length}`;
  return [min, label];
}

export function stats(values: number[]) {
  const [min, label] = summary(values);
  return `${min} ${label}`;
}
'''


