# extract-function: whole statements of a function become a new module-level function, right
# above the top-level declaration they came from. --params and --returns are checked, never
# inferred: they name exactly the locals the lines read from the function around them, and exactly
# the locals the lines declare that later code uses.
#
# The case shape (input, options, output, throws) is described at actionToml in @jig/test-utils:
# a string input is src/a.ts, options are the flags in order, output is src/a.ts afterwards.

name = "extract-function"


[[suites]]
name = "params"


[[suites.tests]]
name = "positional"
input = '''
type User = { name: string };

export function report(user: User, items: string[]) {
  const header = `Report for ${user.name}`;
  console.log(header);
  console.log(items.length);
}
'''
options = {
	file = "src/a.ts",
	lines = "4-5",
	name = "printHeader",
	params = "user",
}
output = '''
type User = { name: string };

function printHeader(user: User) {
  const header = `Report for ${user.name}`;
  console.log(header);
}

export function report(user: User, items: string[]) {
  printHeader(user);
  console.log(items.length);
}
'''


[[suites.tests]]
name = "one object"
input = '''
type User = { name: string };

export function report(user: User, items: string[]) {
  console.log(user.name, items.length);
}
'''
options = {
	file = "src/a.ts",
	lines = "4",
	name = "printSummary",
	params = "{ user, items }",
}
output = '''
type User = { name: string };

function printSummary({ user, items }: { user: User; items: string[] }) {
  console.log(user.name, items.length);
}

export function report(user: User, items: string[]) {
  printSummary({ user, items });
}
'''


