# lift-out: lifts a function or const nested in --in up to module level, above its parent, taking the
# locals it uses along; with --to it moves on to another file. It refuses what cannot move (a parameter
# it uses, a const whose initializer may have side effects, import.meta into another file).
# The case shape (input, options, output, throws) is described at actionToml in @jig/test-utils:
# a table input is a set of files by path, options are the flags in order (fixture picks the example
# folder), output lists every changed file by path (false for a deleted one).

name = "lift-out"


[[suites]]
name = "lift-out"


[[suites.tests]]
name = "lifts a nested function to module level, dedented, above its parent"
input = {}
options = {
	file = "nested.ts",
	in = "outer",
	symbol = "double",
}
output = {
	"nested.ts" = '''
import { keep } from "./a";

function double(x: number) {
  return x * 2 + keep;
}

export function outer(n: number) {
  const LIMIT = 10;
  const clamp = (x: number) => Math.min(x, LIMIT);
  function scaled() {
    return n * 3;
  }
  const started = Date.now();
  const here = () => import.meta;
  return clamp(double(n)) + scaled() + started + (here() ? 0 : 1);
}
''',
}


[[suites.tests]]
name = "doc comments stay with what they describe"
input = {
	"documented.ts" = '''
// file header

/** Does X. */
export function outer() {
  const a = 1; // trailing note on a
  /** Helps. */
  function helper() {
    return 2;
  }
  return a + helper();
}
''',
}
options = {
	file = "documented.ts",
	in = "outer",
	symbol = "helper",
}
output = {
	"documented.ts" = '''
// file header

/** Helps. */
function helper() {
  return 2;
}

/** Does X. */
export function outer() {
  const a = 1; // trailing note on a
  return a + helper();
}
''',
}


[[suites.tests]]
name = "takes the locals it uses along, in source order"
input = {}
options = {
	file = "nested.ts",
	in = "outer",
	symbol = "clamp",
}
output = {
	"nested.ts" = '''
