  function scaled() {
    return n * 3;
  }
  const started = Date.now();
  const here = () => import.meta;
  return clamp(double(n)) + scaled() + started + (here() ? 0 : 1);
}
''',
}


[[suites.tests]]
name = "refuses when it uses a local that cannot move (a parameter)"
input = {}
options = {
	file = "nested.ts",
	in = "outer",
	symbol = "scaled",
}
throws = "^REFACTOR_UNAVAILABLE:"


