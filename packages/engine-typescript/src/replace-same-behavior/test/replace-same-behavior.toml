# replace-same-behavior: the code at --at (exactly --before) becomes --after, only when a rule proves
# the two behave the same. The only rule so far is fold-guard:
#
#   if (C) return R;               const d = C ? null : E;
#   use(..., E, ...);       →      if (d === null) return R;
#                                  use(..., d, ...);
#
# input   = the source of src/a.ts
# options = the flags: at (without the path: <line>:<column>-<line>:<column>, the end just after the
#           last character), before, after; `files` (not a flag) writes more files by path
# output  = src/a.ts afterwards
# throws  = "^<ERROR_CODE>: ..." (the test throws a RefactorError again as "<code>: <message>")


[[suites]]
name = "fold-guard"


[[suites.tests]]
name = "a guard and a choice inside a call's arguments (the proposal's example)"
input = '''
const OUTCOME = { ELIGIBLE: "eligible", OUT_OF_RANGE: "out-of-range", OTHER: "other" } as const;
type Outcome = (typeof OUTCOME)[keyof typeof OUTCOME];
const REASON = { BELOW: "below", AFTER: "after" } as const;

declare function settle(id: string, reason: string, outcome: Outcome): Promise<void>;

export async function choose(id: string, outcome: Outcome) {
  if (outcome === OUTCOME.ELIGIBLE) {
    return "not-retryable";
  }
  await settle(
    id,
    outcome === OUTCOME.OUT_OF_RANGE ? REASON.BELOW : REASON.AFTER,
    outcome,
  );
  return null;
}
'''
options = {
	at = "8:3-15:5",
	before = '''
if (outcome === OUTCOME.ELIGIBLE) {
    return "not-retryable";
  }
  await settle(
    id,
    outcome === OUTCOME.OUT_OF_RANGE ? REASON.BELOW : REASON.AFTER,
    outcome,
  );''',
	after = '''
const decision =
    outcome === OUTCOME.ELIGIBLE
      ? null
      : outcome === OUTCOME.OUT_OF_RANGE
        ? REASON.BELOW
        : REASON.AFTER;
  if (decision === null) return "not-retryable";
  await settle(id, decision, outcome);''',
}
output = '''
const OUTCOME = { ELIGIBLE: "eligible", OUT_OF_RANGE: "out-of-range", OTHER: "other" } as const;
type Outcome = (typeof OUTCOME)[keyof typeof OUTCOME];
const REASON = { BELOW: "below", AFTER: "after" } as const;

declare function settle(id: string, reason: string, outcome: Outcome): Promise<void>;

export async function choose(id: string, outcome: Outcome) {
  const decision =
    outcome === OUTCOME.ELIGIBLE
      ? null
      : outcome === OUTCOME.OUT_OF_RANGE
        ? REASON.BELOW
        : REASON.AFTER;
  if (decision === null) return "not-retryable";
  await settle(id, decision, outcome);
  return null;
}
'''


[[suites.tests]]
name = "a bare return, the value in a variable's initializer"
input = '''
export function f(n: number) {
  if (n < 0) return;
  const size = n > 10 ? "big" : "small";
  console.log(size);
}
'''
options = {
	at = "2:3-3:41",
	before = '''
if (n < 0) return;
  const size = n > 10 ? "big" : "small";''',
	after = '''
const checked = n < 0 ? null : n > 10 ? "big" : "small";
  if (checked === null) return;
  const size = checked;''',
}
output = '''
export function f(n: number) {
  const checked = n < 0 ? null : n > 10 ? "big" : "small";
  if (checked === null) return;
  const size = checked;
  console.log(size);
}
'''


[[suites]]
name = "refused"


[[suites.tests]]
name = "--before is not the code at --at"
input = '''
export function f(n: number) {
  if (n < 0) return;
  console.log(n + 1);
}
'''
options = {
	at = "2:3-3:22",
	before = '''
if (n < 0) return;
  console.log(n + 2);''',
	after = '''
const m = n < 0 ? null : n + 2;
  if (m === null) return;
  console.log(m);''',
}
throws = "^INVALID_ARGS: --before is not the code"


