throws = "^NO_CHANGES: No file matching"


[[suites]]
name = "import forms"


[[suites.tests]]
name = "importers with another local name use `as`; type-only, namespace and merged forms are kept valid"
input = {
	"src/x/widget.ts" = '''
export type Thing = { id: number };
export const extra = 2;

export default function widget(): number {
  return 1;
}
''',
	"src/x/user-a.ts" = '''
import w from "./widget";

export const a = w();
''',
	"src/x/user-b.ts" = '''
import widget, { type Thing } from "./widget";

export const b: Thing | undefined = undefined;
export const c = widget();
''',
	"src/x/user-c.ts" = '''
import { default as renamed } from "./widget";

export const d = renamed();
''',
	"src/x/user-d.ts" = '''
import w, * as all from "./widget";

export const e = [w(), all.extra];
''',
	"src/x/user-e.ts" = '''
import type W from "./shape";

export const f: W | undefined = undefined;
''',
	"src/x/shape.ts" = '''
export default interface Shape {
  sides: number;
}
''',
	"src/x/user-f.ts" = '''
export { default } from "./widget";
export type { default as Sh } from "./shape";
''',
}
options = {
	files = 'src/x/**',
	typecheck = true,
}
output = {
	"src/x/shape.ts" = '''
export interface Shape {
  sides: number;
}
''',
	"src/x/user-a.ts" = '''
import { widget as w } from "./widget";

export const a = w();
''',
	"src/x/user-b.ts" = '''
import { widget, type Thing } from "./widget";

export const b: Thing | undefined = undefined;
export const c = widget();
''',
	"src/x/user-c.ts" = '''
import { widget as renamed } from "./widget";

export const d = renamed();
''',
	"src/x/user-d.ts" = '''
import * as all from "./widget";
import { widget as w } from "./widget";

export const e = [w(), all.extra];
''',
	"src/x/user-e.ts" = '''
import type { Shape as W } from "./shape";

export const f: W | undefined = undefined;
''',
	"src/x/user-f.ts" = '''
export { widget as default } from "./widget";
export type { Shape as Sh } from "./shape";
''',
	"src/x/widget.ts" = '''
export type Thing = { id: number };
export const extra = 2;

export function widget(): number {
  return 1;
}
''',
}


[[suites.tests]]
name = "`export const X` plus `export default X` keeps one named export"
input = {
	"src/y/limit.ts" = '''
export const limit = 10;
export default limit;
''',
	"src/y/use.ts" = '''
import max from "./limit";

export const doubled = max * 2;
''',
}
options = {
	files = 'src/y/**',
	typecheck = true,
}
output = {
	"src/y/limit.ts" = '''
export const limit = 10;
''',
	"src/y/use.ts" = '''
import { limit as max } from "./limit";

export const doubled = max * 2;
''',
}


[[suites.tests]]
name = "`export default abstract class` loses only `default`"
input = {
	"src/z/base.ts" = '''
export default abstract class Base {
  abstract id(): string;
}
''',
	"src/z/impl.ts" = '''
import Base from "./base";

export class Impl extends Base {
  id() {
    return "x";
  }
}
''',
}
options = {
	files = 'src/z/**',
	typecheck = true,
}
output = {
	"src/z/base.ts" = '''
export abstract class Base {
  abstract id(): string;
}
''',
	"src/z/impl.ts" = '''
import { Base } from "./base";

export class Impl extends Base {
  id() {
    return "x";
  }
}
''',
}


[[suites.tests]]
name = "a namespace import that reads `.default` leaves that file not handled"
input = {
	"src/n/thing.ts" = '''
export default function thing() {
  return 1;
}
''',
	"src/n/other.ts" = '''
export default function other() {
  return 2;
}
''',
	"src/n/use.ts" = '''
import * as t from "./thing";

export const x = t.default();
''',
}
options = {
	files = 'src/n/**',
}
output = {
	"src/n/other.ts" = '''
export function other() {
  return 2;
}
''',
}


