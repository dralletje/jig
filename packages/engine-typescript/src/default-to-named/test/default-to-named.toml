[[suites.tests]]
name = "require(...).default in a JS file blocks, also through a .js extension specifier"
input = {
	"src/j/widget.ts" = '''
export default function widget(): number {
  return 1;
}
''',
	"src/j/ok.ts" = '''
export default function ok(): number {
  return 2;
}
''',
	"src/j/free.ts" = '''
export default function free(): number {
  return 4;
}
''',
	"src/j/use.cjs" = '''
const w = require("./widget").default;
module.exports = w;
''',
	"src/j/use2.mjs" = '''
