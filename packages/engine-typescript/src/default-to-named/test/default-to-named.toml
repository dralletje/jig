[[suites.tests]]
name = "anonymous defaults alone leave nothing to do; nothing is written"
input = {
	"src/a/arrow.ts" = '''
export default () => 1;
''',
	"src/a/cls.ts" = '''
export default class {}
''',
}
options = {
	files = 'src/a/**,src/pages/home.ts',
}
throws = "^NO_CHANGES: No default export can be converted[\\s\\S]*src/a/arrow\\.ts: the default export has no name"


