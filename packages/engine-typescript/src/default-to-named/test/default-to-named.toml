# default-to-named: `export default X` becomes a named export in the files --files names (globs, comma-separated),
# and every importer and re-export follows. Files matching --keep are left alone, and so is a file the action
# cannot convert safely (an anonymous default, a JavaScript importer of the default, a namespace import that reads
# `.default`, a vi.mock factory returning default): those are listed as not handled in the report. When nothing
# is left to convert, the run is refused with NO_CHANGES.
# The case shape (input, options, output, throws) is described at actionToml in @jig/test-utils:
# a table input is files by path, options are the flags in order, output is every changed file by path.

name = "default-to-named"


[[suites]]
name = "on examples/default-to-named"


[[suites.tests]]
name = "function, class, const and specifier defaults become named; importers and re-exports follow; routes are kept"
input = {}
options = {
	files = 'src/**',
	keep = 'src/routes/**',
	typecheck = true,
}
output = {
	"src/config.ts" = '''
export type Config = { currency: string; retries: number };

const config: Config = { currency: "USD", retries: 3 };

export { config };
''',
	"src/index.ts" = '''
export { Order } from "./models/Order";
export { formatPrice } from "./lib/format";
export { config } from "./config";
export { sendReceipt as default } from "./services/mailer";
export type { OrderLine } from "./models/Order";
''',
	"src/lib/format.ts" = '''
export function formatPrice(cents: number): string {
  return `$${(cents / 100).toFixed(2)}`;
}
''',
	"src/models/Order.ts" = '''
export type OrderLine = { sku: string; cents: number };

export class Order {
  constructor(readonly lines: OrderLine[]) {}

  total(): number {
    return this.lines.reduce((sum, line) => sum + line.cents, 0);
  }
}
''',
	"src/services/checkout.ts" = '''
import { config, type Config } from "../config";
import { formatPrice as fmt } from "../lib/format";
import { Order } from "../models/Order";
import { sendReceipt } from "./mailer";
import { Store } from "./store";

const store = new Store();

export async function checkout(order: Order, email: string): Promise<string> {
  const settings: Config = config;
  store.put(email, order.total());
  const ok = await sendReceipt(email, `Total: ${fmt(order.total())} ${settings.currency}`);
  return ok ? "sent" : "failed";
}
''',
	"src/services/mailer.ts" = '''
export async function sendReceipt(to: string, body: string): Promise<boolean> {
  return to.includes("@") && body.length > 0;
}
''',
	"src/services/store.ts" = '''
class Store {
  private readonly items = new Map<string, number>();

  put(key: string, value: number): void {
    this.items.set(key, value);
  }
}

export { Store };
''',
}


