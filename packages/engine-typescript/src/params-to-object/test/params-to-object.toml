[[suites.tests]]
name = "a const arrow function works too"
input = {
	"src/area.ts" = '''
export const area = (width: number, height: number): number => width * height;
''',
	"src/use-area.ts" = '''
import { area } from "./area";

export const big = area(10, 20);
''',
}
options = {
	file = "src/area.ts",
	symbol = "area",
	typecheck = true,
}
output = {
	"src/area.ts" = '''
export const area = ({ width, height }: { width: number; height: number; }): number => width * height;
''',
	"src/use-area.ts" = '''
import { area } from "./area";

export const big = area({ width: 10, height: 20 });
''',
}


[[suites.tests]]
name = "a local `export { f }` is not a blocking use; the function and its calls are converted"
input = '''
function sum(a: number, b: number): number {
  return a + b;
}

export { sum };
export const three = sum(1, 2);
'''
options = {
	file = "src/a.ts",
	symbol = "sum",
}
output = '''
function sum({ a, b }: { a: number; b: number; }): number {
  return a + b;
}

export { sum };
export const three = sum({ a: 1, b: 2 });
'''


