# params-to-object: the parameters of --symbol in --file become one destructured object parameter, and
# every call in the repo is rewritten to pass an object. Refused when a call cannot be rewritten (a
# spread argument, the function handed over as a value), and for overloads, rest and destructured
# parameters, functions without parameters, and symbols that are not functions.
#
# The case shape (input, options, output, throws) is described at actionToml in @jig/test-utils:
# a string input is src/a.ts, options are the flags in order, output is src/a.ts afterwards.

name = "params-to-object"


[[suites]]
name = "params-to-object on examples/params-to-object"


[[suites.tests]]
name = "a function with three params called from two files: declaration and calls are rewritten"
input = {}
options = {
	file = "src/shipping.ts",
	symbol = "shippingCost",
	typecheck = true,
}
output = {
	"src/checkout.ts" = '''
import { parcelLabel, shippingCost } from "./shipping";

export function checkout(weightKg: number, distanceKm: number): string {
  const standard = shippingCost({ weightKg, distanceKm, express: false });
  const fast = shippingCost({ weightKg, distanceKm, express: true });
  return `${parcelLabel("order")}: ${standard.toFixed(2)} or ${fast.toFixed(2)} (fast)`;
}
''',
	"src/reports.ts" = '''
import { parcelLabel, shippingCost, totalWeight } from "./shipping";

export function weeklyReport(weights: number[]): string[] {
  const lines = weights.map((w) => `${parcelLabel("w", "[", "]")} ${shippingCost({ weightKg: w, distanceKm: 120, express: false })}`);
  lines.push(`total ${totalWeight(...weights)}`);
  return lines;
}
''',
	"src/shipping.ts" = '''
export type Zone = "domestic" | "europe" | "world";

/** What a parcel costs to send: a base rate per kilometre, plus a surcharge when it is urgent. */
export function shippingCost({ weightKg, distanceKm, express }: { weightKg: number; distanceKm: number; express: boolean; }): number {
  const base = weightKg * 0.4 + distanceKm * 0.05;
  return express ? base * 1.5 : base;
}

/** A label line for a parcel: the prefix and suffix are optional. */
export function parcelLabel(name: string, prefix = "#", suffix?: string): string {
  return `${prefix}${name}${suffix ?? ""}`;
}

export function describeZone(zone: Zone): string {
  return zone === "domestic" ? "inside the country" : zone === "europe" ? "inside Europe" : "overseas";
}

export function totalWeight(...weights: number[]): number {
  return weights.reduce((sum, w) => sum + w, 0);
}

export function parseWeight(text: string): number;
export function parseWeight(text: string, unit: "kg" | "g"): number;
export function parseWeight(text: string, unit: "kg" | "g" = "kg"): number {
  const value = Number.parseFloat(text);
  return unit === "g" ? value / 1000 : value;
}

export function notify(address: string, message: string): string {
  return `to ${address}: ${message}`;
}
''',
}


