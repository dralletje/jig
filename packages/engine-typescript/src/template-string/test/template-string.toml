[[suites.tests]]
name = "an object operand (valueOf vs toString) is refused, so the output stays the same"
input = '''
export const o = { toString() { return 'o'; }, valueOf() { return 1; } };
export function f(): string {
  return 'a' + o;
}
'''
options = {
	at = "src/a.ts:3",
}
throws = "^REFACTOR_UNAVAILABLE: "


[[suites.tests]]
name = "primitive unions, literals and enums still convert"
input = '''
enum E { A = 1 }
export function f(a: string | number | null, b: 'x' | 2n, c: boolean | undefined, d: E): string {
  return 'p' + a + b + c + d;
}
'''
options = {
	at = "src/a.ts:3",
}
output = '''
enum E { A = 1 }
export function f(a: string | number | null, b: 'x' | 2n, c: boolean | undefined, d: E): string {
  return `p${a}${b}${c}${d}`;
}
'''


[[suites.tests]]
name = "a comment inside the chain is refused, not moved into ${}"
input = '''
export function f(x: string): string {
  return "a" + /* keep */ x + "b";
}
'''
options = {
	at = "src/a.ts:2",
}
throws = "^REFACTOR_UNAVAILABLE: "
