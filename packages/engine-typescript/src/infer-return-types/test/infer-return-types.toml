[[suites.tests]]
name = "functions exported by name later, and default exports, count as exported"
input = '''
function late() {
  return 1;
}
function hidden() {
  return 2;
}
export { late as renamed };
export default function () {
  return 'x';
}
'''
options = {
	files = "src/a.ts",
}
output = '''
function late(): number {
  return 1;
}
function hidden() {
  return 2;
}
export { late as renamed };
export default function (): string {
  return 'x';
}
'''


