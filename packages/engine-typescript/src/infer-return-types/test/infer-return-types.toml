[[suites.tests]]
name = "a function whose inferred type names something not in scope is left; the others proceed"
input = '''
export function good(): number {
  return 1;
}
export function outer() {
  interface Hidden {
    a: number;
  }
  const make = () => {
    const h: Hidden = { a: 1 };
    return h;
  };
  return make;
}
export function fine() {
  return 'x';
}
'''
options = {
	files = "src/a.ts",
	typecheck = true,
}
output = '''
export function good(): number {
  return 1;
}
export function outer() {
  interface Hidden {
    a: number;
  }
  const make = () => {
    const h: Hidden = { a: 1 };
    return h;
  };
  return make;
}
export function fine(): string {
  return 'x';
}
'''


[[suites.tests]]
name = "a type that needs an unexported interface of another file does not block the file"
input = {
	"src/hidden.ts" = '''
interface Hidden {
  a: number;
}
export const make = (): Hidden => ({ a: 1 });
''',
	"src/user.ts" = '''
import { make } from './hidden.ts';
export function viaHidden() {
  return make();
}
export function plain() {
  return 2;
}
''',
}
options = {
	files = "src/user.ts",
	typecheck = true,
}
output = {
	"src/user.ts" = '''
import { make } from './hidden.ts';
export function viaHidden() {
  return make();
}
export function plain(): number {
  return 2;
}
''',
}


[[suites.tests]]
name = "object-literal methods and get accessors are candidates"
input = '''
export const api = {
  count() {
    return 1;
  },
  get label() {
    return 'x';
  },
};
const local = {
  hidden() {
    return 2;
  },
};
export class K {
  get size() {
    return 3;
  }
}
export default local;
'''
options = {
	files = "src/a.ts",
	typecheck = true,
}
output = '''
export const api = {
  count(): number {
    return 1;
  },
  get label(): string {
    return 'x';
  },
};
const local = {
  hidden(): number {
    return 2;
  },
};
export class K {
  get size(): number {
    return 3;
  }
}
export default local;
'''
