# infer-return-types: the functions without a return type in --files get the type TypeScript infers,
# written down. Only exported functions, methods, object-literal methods and get accessors, unless
# --exported-only is false. A type that would need an import, or that names something not in scope, and
# an `any` nobody wrote are left alone.
#
# The case shape (input, options, output, throws) is described at actionToml in @jig/test-utils:
# a string input is src/a.ts, options are the flags in order, output is src/a.ts afterwards; a table
# input and output are files by path, the output holding every changed file.

name = "infer-return-types"


[[suites]]
name = "infer-return-types on examples/infer-return-types"


[[suites.tests]]
name = "exported functions and methods gain the inferred types; the rest is left as it is"
input = {}
options = {
	files = "src/**",
	typecheck = true,
}
output = {
	"src/orders.ts" = '''
import { makeLine, makeOrder } from "./models.ts";
import type { Order } from "./models.ts";

export function countLines(order: Order): number {
  return order.lines.length;
}

export function totalQuantity(order: Order): number {
  return order.lines.reduce((sum, line) => sum + line.quantity, 0);
}

export function describe(order: Order): { id: string; lines: number; empty: boolean; } {
  return { id: order.id, lines: order.lines.length, empty: order.lines.length === 0 };
}

export const skus = (order: Order): string[] => order.lines.map((line) => line.sku);

export function emptyOrder(id: string): Order {
  return makeOrder(id, []);
}

export function singleLine(sku: string) {
  return makeLine(sku, 1);
}

export function summarize(order: Order): string {
  return `${order.id}: ${countLines(order)} lines`;
}

export class OrderService {
  private orders = new Map<string, Order>();

  add(order: Order): number {
    this.orders.set(order.id, order);
    return this.orders.size;
  }

  find(id: string): Order | undefined {
    return this.orders.get(id);
  }

  ids(): string[] {
    return [...this.orders.keys()];
  }

  private count() {
    return this.orders.size;
  }
}

function normalize(sku: string) {
  return sku.trim().toLowerCase();
}

const double = (n: number) => n * 2;

export function internalUse(order: Order): number {
  return double(order.lines.map((line) => normalize(line.sku)).length);
}
''',
	"src/reports.ts" = '''
import { makeLine, makeOrder } from "./models.ts";

export function firstLine(skus: string[]) {
  return makeOrder("report", skus.map((sku) => makeLine(sku, 1))).lines[0];
}

export function reportTitle(name: string): string {
  return `Report ${name}`;
}

export function pageSize(): number {
  return 20;
}
''',
}


