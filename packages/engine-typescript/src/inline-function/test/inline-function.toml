declare function sink(x: unknown): void;
const make = (n: number) => ({ n });
const both = (a: number, b: number) => (sink(a), b);
const pick = (c: boolean, a: number, b: number) => (c ? a : b);
export function run(c: boolean, x: number) {
  make(x);
  sink(both(x, 2));
  return pick(c, x, 1) + 1;
}
'''
