[[suites]]
name = "multi-statement functions"


[[suites.tests]]
name = "unpacked at const x = f(...), an expression statement and return f(...); every local clash is renamed"
input = {}
options = {
	file = 'src/multi.ts',
	symbol = 'summarize',
	typecheck = true,
}
output = {
	"src/multi.ts" = '''
function logSize(items: number[]): void {
  const size = items.length;
  sizes.push(size);
}

const sizes: number[] = [];

export function report(items: number[]): string {
  const items2: number[] = items;
  const label: string = "average";
  const total = items2.reduce((a, b) => a + b, 0);
  const average = total / items2.length;
  const first = `${label}: ${average}`;
  logSize(items);
  const items3: number[] = items;
  const label2: string = first;
  const total2 = items3.reduce((a, b) => a + b, 0);
  const average2 = total2 / items3.length;
  return `${label2}: ${average2}`;
}
''',
}


[[suites.tests]]
name = "a void function unpacked as an expression statement"
input = {}
options = {
	file = 'src/multi.ts',
	symbol = 'logSize',
	typecheck = true,
}
output = {
	"src/multi.ts" = '''
// Multi-statement functions: unpacked as a whole statement, a const initializer or a return.
function summarize(items: number[], label: string): string {
  const total = items.reduce((a, b) => a + b, 0);
  const average = total / items.length;
  return `${label}: ${average}`;
}

const sizes: number[] = [];

export function report(items: number[]): string {
  const first = summarize(items, "average");
  const items2: number[] = items;
  const size = items2.length;
  sizes.push(size);
  return summarize(items, first);
}
''',
}


