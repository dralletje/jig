# inline-function: replaces calls of a function by its body ("unpacks" them) and, in definition mode,
# removes the declaration once every call is unpacked.
#
#   --file <path> --symbol <name>            every call of the function in --file, then the declaration
#   --file <path> --symbol <name> --at <path>:<line>[:<column>]
#                                            only the call that starts there; the declaration stays
#
# Cases with `typecheck = true` must leave no type errors in the changed TypeScript files.
# Most cases run on the fixture examples/inline-function (the files named by --file); the edge cases
# bring their own source as a string input, which is src/a.ts.
# The case shape (input, options, output, throws) is described at actionToml in @jig/test-utils:
# a string input is src/a.ts, options are the flags in order, output is src/a.ts afterwards (or every
# changed file by path), and a refusal is a `throws` pattern for "<CODE>: <message>".

name = "inline-function"


[[suites]]
name = "single-expression functions"


[[suites.tests]]
name = "definition mode unpacks every call, adds parentheses where needed, and removes the declaration"
input = {}
options = {
	file = 'src/single.ts',
	symbol = 'square',
	typecheck = true,
}
output = {
	"src/single.ts" = '''
const area = (width: number, height: number) => {
  return width * height;
};

const plus = (a: number, b: number) => a + b;

export function describe(side: number, w: number, h: number): string {
  const s = side * side;
  const a = area(w, h);
  return `${s + (w * w)}:${a}`;
}

export const scaled = (v: number) => 1 + (v * v) * 2;

export const doubled = (w: number) => plus(w, 1) * 2;
''',
}


[[suites.tests]]
name = "a block with only a return is a single expression"
