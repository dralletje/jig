  use(half);
  return half + 1;
}
export function run(x: number, c: boolean) {
  const a = calc(x);
  const b = calc(a);
  if (c) {
    const d = calc(b);
    return d;
  }
  return b;
}
'''
options = {
	file = 'src/a.ts',
	symbol = 'calc',
	typecheck = true,
}
output = '''
declare function use(n: number): void;
export function run(x: number, c: boolean) {
  const n: number = x;
  const half = n / 2;
  use(half);
  const a = half + 1;
  const n2: number = a;
  const half2 = n2 / 2;
  use(half2);
  const b = half2 + 1;
  if (c) {
    const n3: number = b;
    const half3 = n3 / 2;
    use(half3);
    const d = half3 + 1;
    return d;
  }
  return b;
}
'''


