# remove-console: the console.<method> statements (default: log) in --files are removed; --methods
# names others. A call used as a value is left, a brace-less if body is replaced by {} (or the whole
# if goes when its condition is pure and it has no else), comments on a removed line go with it, and
# no stray blank lines or whitespace-only lines are left. Refused when nothing could be removed, or
# when the removal would introduce a type error.
#
# The case shape (input, options, output, throws) is described at actionToml in @jig/test-utils:
# a string input is src/a.ts, options are the flags in order, output is src/a.ts afterwards; a table
# input and output are files by path, the output holding every changed file.

name = "remove-console"


[[suites]]
name = "remove-console on examples/remove-console"


[[suites.tests]]
name = "console.log statements go, other methods stay, calls used as values are left"
input = {}
options = {
	files = "src/**",
	typecheck = true,
}
output = {
	"src/guards.ts" = '''
let calls = 0;

function next(): number {
  calls += 1;
  return calls;
}

export function pureGuard(verbose: boolean, id: string): string {
  return id;
}

export function guardWithElse(verbose: boolean, id: string): string {
  if (verbose) {}
  else id = id.trim();
  return id;
}

export function sideEffectGuard(id: string): string {
  if (next() > 1) {}
  return id;
}

export function loop(ids: string[]): void {
  for (const id of ids) {}
  while (next() < 3) {}
}
''',
	"src/lines.ts" = '''
export function lines(ids: string[]): string {
  let out = "";

  for (const id of ids) {
    out += id;
  }

  out += "!";

  return out;
}
''',
	"src/orders.ts" = '''
export type Order = { id: string; total: number };

export function process(order: Order): number {
  const tax = order.total * 0.2;

  console.debug("tax", tax); // temporary

  // keep the rounding rule in one place
  const rounded = Math.round(tax * 100) / 100;
  console.warn("rounded", rounded);
  return order.total + rounded;
}

export function summarize(orders: Order[]): number {
  return orders.reduce((sum, order) => {
    return sum + order.total;
  }, 0);
}

export const trace = (message: string) => console.log(message);

export function describe(order: Order): string {
  const logged = console.log("describing", order.id);
  void logged;
  return `order ${order.id}`;
}
''',
}


