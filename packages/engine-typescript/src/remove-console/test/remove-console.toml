[[suites.tests]]
name = "a console that is not the global one is left alone"
input = '''
export function f(console: { log(x: string): void }): void {
  console.log("mine");
}
'''
options = {
	files = "src/**",
}
output = '''
export function f(console: { log(x: string): void }): void {
  console.log("mine");
}
'''


[[suites.tests]]
name = "else-if branches and nested ifs keep valid syntax"
input = '''
export function f(a: boolean, b: boolean): void {
  if (a) console.log(1);
  else if (b) console.log(2);
  if (a) if (b) console.log(3);
}
'''
options = {
	files = "src/**",
	typecheck = true,
}
output = '''
export function f(a: boolean, b: boolean): void {
  if (a) {}
  else {}
}
'''


[[suites.tests]]
name = "a removal that would introduce an error refuses and writes nothing"
input = '''
export function f(): void {
  const x = 1;
  console.log(x);
}
'''
options = {
	files = "src/a.ts",
	extra_files = {
		"tsconfig.json" = '''
{ "compilerOptions": { "strict": true, "noEmit": true, "noUnusedLocals": true, "lib": ["esnext", "dom"], "types": [] }, "include": ["src"] }
''',
	},
}
throws = "^REFACTOR_UNAVAILABLE: "


