[[suites.tests]]
name = "statements sharing a blank line are all removed"
input = '''
export function f(n: number): number {
  console.log(1);

  console.log(2);
}
'''
options = {
	files = "src/**",
}
output = '''
export function f(n: number): number {
}
'''


[[suites.tests]]
name = "adjacent removed statements with blank lines around leave no double blank line"
input = '''
export function f(n: number): number {
  const a = n;

  console.log(1);
  console.log(2);

  return a;
}
'''
options = {
	files = "src/**",
}
output = '''
export function f(n: number): number {
  const a = n;

  return a;
}
'''


[[suites.tests]]
name = "when every call is a value, it is NO_CHANGES"
input = '''
export const a = (m: string) => console.log(m);
export const b = (m: string) => console.log(m + 1);
'''
options = {
	files = "src/a.ts",
}
throws = "^NO_CHANGES: "


