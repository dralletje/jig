[[suites.tests]]
name = "type-only, mixed, default and re-export declarations keep their meaning"
input = {
	"src/geo/shapes.ts" = '''
export interface Shape {
  size: number;
}

export function area(shape: Shape) {
  return shape.size * shape.size;
}
''',
	"src/geo/index.ts" = '''
export * from "./shapes";
''',
	"src/stores/index.ts" = '''
export { default as Store } from "@/services/store";
''',
	"src/extra/mixed.ts" = '''
import type { Level } from "@/lib";
import { area, type Shape } from "@/geo";
import { Store as S } from "@/stores";
export { currency, type Level as Lvl } from "@/lib";

export const level: Level = "info";
export const store = new S<{ id: string }>();
export const big = (shape: Shape) => area(shape) > 10;
''',
}
options = {
	files = "src/extra/**",
}
output = {
	"src/extra/mixed.ts" = '''
import type { Level } from "@/lib/logger";
import { area, type Shape } from "@/geo/shapes";
import S from "@/services/store";
export { formatCurrency as currency } from "@/lib/format";
export { type Level as Lvl } from "@/lib/logger";

export const level: Level = "info";
export const store = new S<{ id: string }>();
export const big = (shape: Shape) => area(shape) > 10;
''',
	"src/geo/index.ts" = false,
	"src/stores/index.ts" = false,
}


[[suites.tests]]
name = "the same name reached through two `export *` paths resolves to its one definition"
input = {
	"src/dia/a.ts" = '''
export const x = 1;
''',
	"src/dia/c.ts" = '''
export * from "./a";

export const c = 3;
''',
	"src/dia/index.ts" = '''
export * from "./a";
export * from "./c";
''',
	"src/use.ts" = '''
import { x, c } from './dia';

export const y = x + c;
''',
}
options = {
	files = "src/use.ts",
}
output = {
	"src/dia/index.ts" = false,
	"src/use.ts" = '''
import { x } from './dia/a';
import { c } from './dia/c';

export const y = x + c;
''',
}


[[suites.tests]]
name = "a name two `export *` give different definitions of is REFACTOR_UNAVAILABLE"
input = {
	"src/amb/a.ts" = '''
export const x = 1;
''',
	"src/amb/b.ts" = '''
export const x = 2;
''',
	"src/amb/index.ts" = '''
export * from "./a";
export * from "./b";
''',
	"src/use.ts" = '''
import { x } from "./amb";

export const y = x;
''',
}
options = {
	files = "src/use.ts",
}
throws = "^REFACTOR_UNAVAILABLE: src/amb/index\\.ts exports x from more than one module through export \\*"


