'''
options = {
	at = 'src/a.ts:1',
	to = 'function',
}
throws = "^REFACTOR_UNAVAILABLE: `mutable` is declared with let or var"


[[suites.tests]]
name = "an asserts signature survives the conversion"
input = '''
export const assertIt = (x: unknown): asserts x is string => {
  if (typeof x !== 'string') throw new Error();
};
'''
options = {
	at = 'src/a.ts:1',
	to = 'function',
	typecheck = true,
}
output = '''
export function assertIt(x: unknown): asserts x is string {
  if (typeof x !== 'string') throw new Error();
}
'''


[[suites.tests]]
name = "--to function keeps a comment between => and an expression body (line comment)"
input = '''
export const f = (n: number) => // keep me
  n * 2;
export const g = (n: number) => /* and me */ n + 1;
'''
options = {
	at = 'src/a.ts:1',
	to = 'function',
}
output = '''
export function f(n: number) {
  // keep me
  return n * 2;
}
export const g = (n: number) => /* and me */ n + 1;
'''


[[suites.tests]]
name = "--to function keeps a comment between => and an expression body (block comment)"
input = '''
export const f = (n: number) => // keep me
  n * 2;
export const g = (n: number) => /* and me */ n + 1;
'''
options = {
	at = 'src/a.ts:3',
	to = 'function',
}
output = '''
export const f = (n: number) => // keep me
  n * 2;
export function g(n: number) {
  /* and me */
  return n + 1;
}
'''


[[suites]]
name = "--at"


