# add-import-extensions: relative imports, re-exports and dynamic imports get the extension of the file they
# resolve to (`./dir` becomes `./dir/index.ts`), and the tsconfig gets allowImportingTsExtensions. Declaration
# files, unresolved imports, packages and alias imports stay. The tsconfig must have noEmit or emitDeclarationOnly.
# The case shape (input, options, output, throws) is described at actionToml in @jig/test-utils:
# options are the flags in order, output is the files that changed.

name = "add-import-extensions"


[[suites]]
name = "add-import-extensions on examples/webapp"


[[suites.tests]]
name = "relative imports, re-exports and dynamic imports get the file's extension; the tsconfig allows it"
input = {}
options = {
	files = "src/**",
	typecheck = true,
}
output = {
	"src/lib/index.ts" = '''
export * from "./math.ts";
export { formatDate, formatCurrency as currency, formatPrice } from "./format.ts";
export * from "./strings/index.ts";
export type { Level } from "./logger.ts";
''',
	"src/lib/strings/index.ts" = '''
export * from "./slugify.ts";
export { capitalize } from "./capitalize.ts";
''',
	"src/models/index.ts" = '''
export * from "./User.ts";
export * from "./order_item.ts";
''',
	"src/reports.ts" = '''
/** Reports are rare: their math is loaded on demand. */
export async function totalOf(values: number[]) {
  const { sum } = await import("./lib/math.ts");
  return sum(values);
}
''',
	"src/services/index.ts" = '''
export * from "./userService.ts";
export { orderTotal, describeOrder, discount } from "./order-service.ts";
''',
	"src/services/userService.ts" = '''
import { User, Role } from "@/models";
import { capitalize, slugify } from "@/lib";
import createLogger from "@/lib/logger";
import Store from "./store.ts";

const log = createLogger("users", "info");
const users = new Store<User>();

export function createUser(name: string, email: string, role: Role) {
  const user: User = { id: slugify(name, 32), name: capitalize(name), email, role, createdAt: new Date() };
  console.log("created user", user.id);
  log.info(`created ${user.id}`);
  return users.add(user);
}

export function findUser(id: string) {
  return users.get(id);
}

export function isAdmin(user: User) {
  return user.role === "admin";
}
''',
	"src/setup/index.ts" = '''
export * from "./register.ts";
''',
	"src/widgets/index.ts" = '''
export * from "./badge.ts";

export const WIDGET_PREFIX = "w-";
''',
	"tsconfig.json" = '''
{
  "compilerOptions": {
    "strict": true,
    "noEmit": true,
    "module": "esnext",
    "moduleResolution": "bundler",
    "target": "esnext",
    "skipLibCheck": true,
    "types": [],
    "paths": {
      "@/*": ["./src/*"]
    },
    "allowImportingTsExtensions": true
  },
  "include": ["src"]
}
''',
}


