[[suites.tests]]
name = "examples/react-app: .tsx targets"
input = {}
options = {
	fixture = "examples/react-app",
	files = "src/**",
}
output = {
	"src/App.tsx" = '''
import React from "react";
import Counter from "./components/Counter.tsx";

export default function App() {
  return (
    <main>
      <h1>Counter</h1>
      <Counter start={5} />
    </main>
  );
}
''',
	"src/components/Counter.tsx" = '''
import React from "react";
import Button from "./Button.tsx";

type CounterProps = { start: number };
type CounterState = { count: number };

export default class Counter extends React.Component<CounterProps, CounterState> {
  state: CounterState = { count: 0 };

  componentWillMount() {
    this.setState({ count: this.props.start });
  }

  componentWillReceiveProps(next: CounterProps) {
    if (next.start !== this.props.start) this.setState({ count: next.start });
  }

  render() {
    return (
      <div>
        <span>{this.state.count}</span>
        <Button label="+1" onClick={() => this.setState({ count: this.state.count + 1 })} />
      </div>
    );
  }
}
''',
	"src/index.tsx" = '''
import React from "react";
import ReactDOM from "react-dom";
import App from "./App.tsx";

ReactDOM.render(<App />, document.getElementById("root"));
''',
	"tsconfig.json" = '''
{
  "compilerOptions": {
    "strict": true,
    "noEmit": true,
    "jsx": "react",
    "module": "esnext",
    "moduleResolution": "bundler",
    "target": "esnext",
    "skipLibCheck": true,
    "allowImportingTsExtensions": true
  },
  "include": ["src"]
}
''',
}


