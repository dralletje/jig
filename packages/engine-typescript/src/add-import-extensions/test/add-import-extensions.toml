[[suites.tests]]
name = "side-effect and type-only imports stay intact, quotes are kept, template dynamic imports count"
input = {
	"src/extra/side.ts" = '''
export const side = 1;
''',
	"src/extra/types.d.ts" = '''
export interface T {
  a: number;
}
''',
	"src/extra/use.ts" = '''
import './side';
import type { T } from "./types";
import { type Level } from "../lib/logger";
export { sum } from "../lib/math";
export * as strings from "../lib/strings";

export const later = () => import(`../lib/format`);
const where = "./side";
export const dynamic = () => import(where);
export type Both = [T, Level, typeof import("../lib/math")];
''',
}
