[[suites.tests]]
name = "a copy within the same package (same nearest package.json) is allowed"
input = {
	"src/pkg/package.json" = '''
{ "name": "pkg", "private": true }
''',
	"src/pkg/lib/a.ts" = '''
export const a = 1;
''',
}
options = {
	from = "src/pkg/lib",
	to = "src/pkg/lib2",
}
output = {
	"src/pkg/lib2/a.ts" = '''
export const a = 1;
''',
}


[[suites.tests]]
name = "a copy's JSDoc imports and triple-slash references follow it"
input = {
	"src/feature/tool.js" = '''
/** @import { shared } from "../shared.ts" */

/** @param {import("./sub/b.ts").B} value */
export function apply(value) {
  return value;
}
''',
	"src/feature/ref.ts" = '''
/// <reference path="../shared.ts" />
/// <reference path="./sub/b.ts" />
export {};
''',
}
options = {
	from = "src/feature",
	to = "src/deep/feature2",
}
output = {
	"src/deep/feature2/a.ts" = '''
import { shared } from "../../shared";
import { b } from "./sub/b";
import type { B } from "./sub/b.ts";
import "./styles.css";

export const a = shared + b.b;

export function useB(x: B): number {
  return x.b;
}
''',
	"src/deep/feature2/index.ts" = '''
export { a } from "./a";
export { b } from "./sub/b.ts";
''',
	"src/deep/feature2/logo.png" = '''
logo placeholder
''',
	"src/deep/feature2/ref.ts" = '''
/// <reference path="../../shared.ts" />
/// <reference path="./sub/b.ts" />
export {};
''',
	"src/deep/feature2/styles.css" = '''
.feature {
  color: teal;
}
''',
	"src/deep/feature2/sub/b.ts" = '''
export type B = { b: number };

export const b: B = { b: 1 };
''',
	"src/deep/feature2/tool.js" = '''
/** @import { shared } from "../../shared.ts" */

/** @param {import("./sub/b.ts").B} value */
export function apply(value) {
  return value;
}
''',
}


