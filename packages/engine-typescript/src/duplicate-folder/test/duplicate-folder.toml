# duplicate-folder: copies the folder --from to --to, rewriting the specifiers of the copies so they keep
# pointing at what they pointed at (the copies of the files inside the folder, the originals outside it).
# Importers outside the folder are left on the originals.
#
# The example's src/feature/logo.png is a real binary file, which these cases cannot say; each suite
# replaces it with a text placeholder (options.extra_files). Copying the real bytes is tested in
# duplicate-folder.test.ts, with the symlinks and the timing.
# The case shape (input, options, output, throws) is described at actionToml in @jig/test-utils:
# a table input is files by path, options are the flags in order, output is every changed file.

name = "duplicate-folder"


[[suites]]
name = "copying"
options = {
	extra_files = {
		"src/feature/logo.png" = "logo placeholder\n",
	},
}


[[suites.tests]]
name = "copies a folder and leaves outside importers on the originals"
input = {}
options = {
	from = "src/feature",
	to = "src/deep/feature2",
	typecheck = true,
}
output = {
	"src/deep/feature2/a.ts" = '''
import { shared } from "../../shared";
import { b } from "./sub/b";
import type { B } from "./sub/b.ts";
import "./styles.css";

export const a = shared + b.b;

export function useB(x: B): number {
  return x.b;
}
''',
	"src/deep/feature2/index.ts" = '''
export { a } from "./a";
export { b } from "./sub/b.ts";
''',
	"src/deep/feature2/logo.png" = '''
logo placeholder
''',
	"src/deep/feature2/styles.css" = '''
.feature {
  color: teal;
}
''',
	"src/deep/feature2/sub/b.ts" = '''
export type B = { b: number };

export const b: B = { b: 1 };
''',
}


