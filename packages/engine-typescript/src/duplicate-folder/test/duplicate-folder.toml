[[suites]]
name = "refusals"
options = {
	extra_files = {
		"src/feature/logo.png" = "logo placeholder\n",
	},
}


[[suites.tests]]
name = "a --from that does not exist is INVALID_ARGS"
input = {}
options = {
	from = "src/nothing",
	to = "src/else",
}
throws = "^INVALID_ARGS: No file is under --from src/nothing"


[[suites.tests]]
name = "a --from that is a file is INVALID_ARGS"
input = {}
options = {
	from = "src/user.ts",
	to = "src/else",
}
throws = "^INVALID_ARGS: --from src/user.ts is a file, not a folder"


[[suites.tests]]
name = "a copy into another package (another nearest package.json) is INVALID_ARGS"
input = {
	"src/other/package.json" = '''
{ "name": "other", "private": true }
''',
	"src/other/inner/keep.ts" = '''
export {};
''',
}
options = {
	from = "src/feature",
	to = "src/other/feature",
}
throws = "^INVALID_ARGS: --from src/feature is in the package of package.json, but --to src/other/feature is in the package of src/other/package.json"


[[suites.tests]]
name = "a copy out of another package (another nearest package.json) is INVALID_ARGS"
input = {
	"src/other/package.json" = '''
{ "name": "other", "private": true }
''',
	"src/other/inner/keep.ts" = '''
export {};
''',
}
options = {
	from = "src/other/inner",
	to = "src/inner",
}
throws = "^INVALID_ARGS: --from src/other/inner is in the package of src/other/package.json, but --to src/inner is in the package of package.json"


[[suites.tests]]
name = "a --to folder that already exists is INVALID_ARGS"
input = {
	"src/feature2/other.ts" = '''
export {};
''',
}
options = {
	from = "src/feature",
	to = "src/feature2",
}
throws = "^INVALID_ARGS: --to src/feature2 already exists"


[[suites.tests]]
name = "a --to that is an existing file is INVALID_ARGS"
input = {}
options = {
	from = "src/feature",
	to = "src/shared.ts",
}
throws = "^INVALID_ARGS: --to src/shared.ts already exists"


[[suites.tests]]
name = "a --to under an existing file is INVALID_ARGS"
input = {}
options = {
	from = "src/feature",
	to = "src/shared.ts/feature",
}
throws = "^INVALID_ARGS: --to src/shared.ts/feature is under src/shared.ts, which is a file"


[[suites.tests]]
name = "a --to inside --from is INVALID_ARGS"
input = {}
options = {
	from = "src/feature",
	to = "src/feature/v2",
}
throws = "^INVALID_ARGS: --to src/feature/v2 is inside --from src/feature"


[[suites.tests]]
name = "--from equal to --to is INVALID_ARGS"
input = {}
options = {
	from = "src/feature",
	to = "src/feature/",
}
throws = "^INVALID_ARGS: --from and --to are both src/feature"


[[suites.tests]]
name = "the repo root as --from is INVALID_ARGS"
input = {}
options = {
	from = ".",
	to = "copy",
}
throws = "^INVALID_ARGS: --to copy is inside --from \\."


[[suites.tests]]
name = "a --from outside the repo is INVALID_ARGS"
input = {}
options = {
	from = "../elsewhere",
	to = "src/else",
}
throws = "^INVALID_ARGS: --from \\.\\./elsewhere is outside the repo"


[[suites.tests]]
name = "a --to outside the repo is INVALID_ARGS"
input = {}
options = {
	from = "src/feature",
	to = "/tmp/elsewhere",
}
throws = "^INVALID_ARGS: --to /tmp/elsewhere is outside the repo"


[[suites.tests]]
name = "a folder holding a package.json is INVALID_ARGS, named"
input = {
	"src/feature/package.json" = '''
{}
''',
}
options = {
	from = "src/feature",
	to = "src/deep/feature2",
}
throws = "^INVALID_ARGS: src/feature/package.json is under --from src/feature"


[[suites.tests]]
name = "a --to outside the tsconfig's include refuses"
input = {}
options = {
	from = "src/feature",
	to = "lib/feature",
}
throws = "^REFACTOR_UNAVAILABLE: Nothing was copied: 3 references cannot follow[\\s\\S]*tsconfig.json would not include lib/feature/a.ts"


[[suites.tests]]
name = "a query import in a copy refuses"
input = {
	"src/feature/inline.ts" = '''
import "./styles.css?inline";

export {};
''',
	"src/icons.ts" = '''
import "./feature/logo.png?react";

export {};
''',
}
options = {
	from = "src/feature",
	to = "src/deep/feature2",
}
throws = "^REFACTOR_UNAVAILABLE: Nothing was copied: 1 reference cannot follow[\\s\\S]*is a query import of src/feature/styles.css"


[[suites.tests]]
name = "a relative import in a copied file that does not resolve refuses"
input = {
	"src/feature/broken.ts" = '''
import { x } from "./missing";

export const y = x;
''',
}
options = {
	from = "src/feature",
	to = "src/deep/feature2",
}
throws = "^REFACTOR_UNAVAILABLE: Nothing was copied: 1 reference cannot follow[\\s\\S]*\"./missing\" does not resolve"


[[suites.tests]]
name = "a URL with a query or hash in a copy refuses"
input = {
	"src/feature/worker.ts" = '''
export const shared = new URL("../shared.ts#x", import.meta.url);
''',
}
options = {
	from = "src/feature",
	to = "src/deep/feature2",
}
throws = "^REFACTOR_UNAVAILABLE: Nothing was copied: 1 reference cannot follow[\\s\\S]*has a query or hash"
