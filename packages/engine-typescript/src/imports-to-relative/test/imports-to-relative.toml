# imports-to-relative: every alias (tsconfig paths) or subpath (package.json imports) import of a file that
# --targets matches becomes a relative import. --files says which files change. Packages, relative imports,
# imports that do not resolve, targets outside the importer's project folder and exact (non-wildcard) keys stay.
# The case shape (input, options, output, throws) is described at actionToml in @jig/test-utils:
# a string input is src/a.ts, options are the flags in order, output is the files that changed.

name = "imports-to-relative"


[[suites]]
name = "imports-to-relative"


[[suites.tests]]
name = "alias and subpath imports become relative imports; relative ones stay"
input = {}
options = {
	files = "src/**",
	targets = "**",
}
output = {
	"src/components/Invoice.ts" = '''
import { formatDay } from "../lib/date.ts";
import type { Day } from "../lib/date.ts";
import { cents } from "../lib/money.ts";

export function invoiceLine(day: Day, amount: number): string {
  return `${formatDay(day)}: ${cents(amount)}`;
}

export const loadLib = () => import("../lib/index.ts");
''',
	"src/main.ts" = '''
import { invoiceLine } from "./components/Invoice.ts";
import { formatDay } from "./lib/index.ts";

console.log(invoiceLine({ year: 2026, month: 1, day: 2 }, 1250));
console.log(formatDay({ year: 2026, month: 1, day: 3 }));
''',
}


[[suites.tests]]
name = "a .js specifier for a .ts file stays .js"
input = {
	"tsconfig.json" = '''
{
  "compilerOptions": {
    "strict": true,
    "noEmit": true,
    "module": "esnext",
    "moduleResolution": "bundler",
    "target": "esnext",
    "skipLibCheck": true,
    "types": [],
    "paths": {
      "@/*": ["./src/*"]
    }
  },
  "include": ["src"]
}
''',
	"src/extra/forms.ts" = '''
import { formatDay } from "@/lib/date.js";
export const f = formatDay;
''',
}
options = {
	files = "src/extra/**",
	targets = "**",
}
output = {
	"src/extra/forms.ts" = '''
import { formatDay } from "../lib/date.js";
export const f = formatDay;
''',
}


[[suites.tests]]
name = "import types, re-exports, import(), import = require(), require() and import() types all change"
input = {
	"src/extra/forms.ts" = '''
declare function require(id: string): unknown;
import type { Day } from "@/lib/date.ts";
import { type Day as D2, formatDay } from "@/lib/date.ts";
export { cents } from "@/lib/money.ts";
export * from "@/lib/index.ts";
import money = require("@/lib/money.ts");
const late = require("@/lib/date.ts");
export const lazy = () => import("@/lib/money.ts");
export type DateModule = typeof import("@/lib/date.ts");
export const all = [formatDay, money, late];
export type Both = [Day, D2];
''',
}
options = {
	files = "src/extra/**",
	targets = "**",
}
output = {
	"src/extra/forms.ts" = '''
declare function require(id: string): unknown;
import type { Day } from "../lib/date.ts";
import { type Day as D2, formatDay } from "../lib/date.ts";
export { cents } from "../lib/money.ts";
export * from "../lib/index.ts";
import money = require("../lib/money.ts");
const late = require("../lib/date.ts");
export const lazy = () => import("../lib/money.ts");
export type DateModule = typeof import("../lib/date.ts");
export const all = [formatDay, money, late];
export type Both = [Day, D2];
''',
}


[[suites.tests]]
name = "packages, relative imports and a file without other styles are untouched"
input = {
	"src/extra/pkg.ts" = '''
import { thing } from "some-package";
import { cents } from "../lib/money.ts";
export const x = [thing, cents];
''',
}
options = {
	files = "src/extra/**",
	targets = "**",
}
throws = "^NO_CHANGES: "


[[suites.tests]]
name = "a target outside the importer's project folder is left alone"
input = {
	"app/tsconfig.json" = '''
{ "compilerOptions": { "module": "esnext", "moduleResolution": "bundler", "allowImportingTsExtensions": true, "noEmit": true, "paths": { "@shared/*": ["../shared/*"], "@app/*": ["./src/*"] } } }
''',
	"app/src/a.ts" = '''
import { s } from "@shared/s.ts";
import { b } from "@app/b.ts";
export const a = [s, b];
''',
	"app/src/b.ts" = '''
export const b = 1;
''',
	"shared/s.ts" = '''
export const s = 1;
''',
}
options = {
	files = "app/**",
	targets = "**",
}
output = {
	"app/src/a.ts" = '''
import { s } from "@shared/s.ts";
import { b } from "./b.ts";
export const a = [s, b];
''',
}


[[suites.tests]]
name = "an import that does not resolve, and one through an exact paths key, are left alone"
input = {
	"tsconfig.json" = '''
{
  "compilerOptions": {
    "strict": true,
    "noEmit": true,
    "module": "esnext",
    "moduleResolution": "bundler",
    "target": "esnext",
    "skipLibCheck": true,
    "types": [],
    "allowImportingTsExtensions": true,
    "paths": {
      "@/*": ["./src/*"],
      "@money": ["./src/lib/money.ts"]
    }
  },
  "include": ["src"]
}
''',
	"src/extra/use.ts" = '''
import { nope } from "@/lib/nope.ts";
import { cents } from "@money";
import { formatDay } from "@/lib/date.ts";
export const x = [nope, cents, formatDay];
''',
}
options = {
	files = "src/extra/**",
	targets = "**",
}
output = {
	"src/extra/use.ts" = '''
import { nope } from "@/lib/nope.ts";
import { cents } from "@money";
import { formatDay } from "../lib/date.ts";
export const x = [nope, cents, formatDay];
''',
}


