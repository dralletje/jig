[[suites]]
name = "edge cases"


[[suites.tests]]
name = "a package reached through a catch-all \"*\" paths key is a package: never rewritten into node_modules"
input = {
	"tsconfig.json" = '''
{
  "compilerOptions": {
    "module": "esnext",
    "moduleResolution": "bundler",
    "strict": true,
    "noEmit": true,
    "allowImportingTsExtensions": true,
    "types": [],
    "baseUrl": ".",
    "paths": {
      "*": [
        "./types/*"
      ],
      "@/*": [
        "./src/*"
      ]
    }
  }
}
''',
	"node_modules/@types/dep/index.d.ts" = '''
export declare const x: number;
''',
	"node_modules/@types/dep/package.json" = '''
{ "name": "@types/dep", "types": "index.d.ts" }
''',
	"node_modules/dep/package.json" = '''
{ "name": "dep", "main": "index.js" }
''',
	"node_modules/dep/index.js" = '''
exports.x = 1;
''',
	"src/x/a.ts" = '''
import { x } from "dep";
import { formatDay } from "@/lib/date";
export const z = [x, formatDay];
''',
}
options = {
	files = "src/x/**",
	targets = "**",
}
output = {
	"src/x/a.ts" = '''
import { x } from "dep";
import { formatDay } from "../lib/date";
export const z = [x, formatDay];
''',
}


[[suites.tests]]
name = "a subpath key mapped to a package (\"#dep\": \"dep\") is a package: untouched"
input = {
	"package.json" = '''
{ "type": "module", "imports": { "#/*": "./src/*", "#dep": "dep" } }
''',
	"node_modules/dep/package.json" = '''
{ "name": "dep", "types": "index.d.ts" }
''',
	"node_modules/dep/index.d.ts" = '''
export declare const x: number;
''',
	"src/x/a.ts" = '''
import { x } from "#dep";
import { cents } from "#/lib/money.ts";
export const z = [x, cents];
''',
}
options = {
	files = "src/x/**",
	targets = "**",
}
output = {
	"src/x/a.ts" = '''
import { x } from "#dep";
import { cents } from "../lib/money.ts";
export const z = [x, cents];
''',
}


[[suites.tests]]
name = "an exact subpath key to an index file is left alone, whatever its target"
input = {
	"package.json" = '''
{ "type": "module", "imports": { "#/*": "./src/*", "#config": "./src/config/index.ts" } }
''',
	"src/config/index.ts" = '''
export const c = 1;
''',
	"src/x/a.ts" = '''
import { c } from "#config";
export const z = c;
''',
}
options = {
	files = "src/x/**",
	targets = "**",
}
throws = "^NO_CHANGES: "


[[suites.tests]]
name = "a relative path to a sibling whose name starts with \"..\" gets \"./\""
input = {
	"src/x/..foo.ts" = '''
export const f = 1;
''',
	"src/x/a.ts" = '''
import { f } from "@/x/..foo.ts";
export const z = f;
''',
}
options = {
	files = "src/x/a.ts",
	targets = "**",
}
output = {
	"src/x/a.ts" = '''
import { f } from "./..foo.ts";
export const z = f;
''',
}
